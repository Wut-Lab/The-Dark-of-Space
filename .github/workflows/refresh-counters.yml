name: Refresh play counters
# Clears GitHub's image cache for the README's GoatCounter counters so they show fresh numbers.
# Commits nothing; it only sends PURGE requests to GitHub's image proxy.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md]
permissions: {}
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge cached counter images
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}" \
            | grep -o 'https://camo.githubusercontent.com/[^"]*' | sort -u \
            | while read -r u; do echo "PURGE $u"; curl -fsS -X PURGE "$u" || true; done
      - name: Show current counts
        run: |
          for n in TOTAL launch home lost; do
            echo "$n: $(curl -s https://darkofspace.goatcounter.com/counter/$n.json)"
          done
          curl -sI "https://darkofspace.goatcounter.com/counter/TOTAL.svg?no_branding=1" | grep -i 'cache-control\|^HTTP' || true
      - name: Diagnose
        run: |
          for n in TOTAL launch; do
            echo "== $n svg"; curl -s "https://darkofspace.goatcounter.com/counter/$n.svg?no_branding=1" | head -c 600; echo
          done
          curl -fsSL "https://github.com/${{ github.repository }}" | grep -o 'https://camo.githubusercontent.com/[^"]*' | sort -u | while read -r u; do
            echo "== $u"; curl -s -D - -o /tmp/b "$u" | grep -i '^HTTP\|content-type\|cache-control\|age:'; head -c 300 /tmp/b; echo
          done
